name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Rust 1.90.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.90.0

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Report tool versions
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build library
        run: cargo build --locked

      - name: Test debug build
        run: cargo test --locked

      - name: Test release build
        run: cargo test --locked --release

      - name: Verify independent references
        run: |
          for script in scripts/reference_*.py; do
            python3 "$script" --check
          done

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Run examples
        run: |
          for example in examples/*.rs; do
            cargo run --locked --example "$(basename "$example" .rs)"
          done

      - name: Compile benchmark harnesses
        run: cargo bench --locked --no-run
