[package]
name = "celandine"
version = "0.1.0"
edition = "2024"
description = "Information-theoretic measures for finite discrete sequences"
publish = false

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.9", default-features = false, features = ["std"] }

[[bench]]
name = "shannon"
harness = false

[[test]]
name = "allocations"
harness = false

[[bench]]
name = "hartley"
harness = false

[[bench]]
name = "renyi"
harness = false

[[bench]]
name = "collision"
harness = false

[[bench]]
name = "min_entropy"
harness = false

[[bench]]
name = "tsallis"
harness = false

[lints.rust]
missing_docs = "warn"

[[bench]]
name = "ngrams"
harness = false
