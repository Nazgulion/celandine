[package]
name = "celandine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Information-theoretic measures for finite discrete sequences"
license = "MIT"
repository = "https://github.com/Nazgulion/celandine"
readme = "README.md"
publish = false

[features]
default = []
compression-deflate = ["dep:miniz_oxide"]

[dependencies]
miniz_oxide = { version = "=0.9.1", optional = true, default-features = false, features = ["with-alloc"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.9", default-features = false, features = ["std"] }

[[bench]]
name = "shannon"
harness = false

[[test]]
name = "allocations"
harness = false

[[bench]]
name = "hartley"
harness = false

[[bench]]
name = "renyi"
harness = false

[[bench]]
name = "collision"
harness = false

[[bench]]
name = "min_entropy"
harness = false

[[bench]]
name = "tsallis"
harness = false

[lints.rust]
missing_docs = "warn"

[[bench]]
name = "ngrams"
harness = false

[[bench]]
name = "shannon_base"
harness = false

[[bench]]
name = "peak_memory"
harness = false

[[bench]]
name = "total_variation"
harness = false

[[bench]]
name = "jensen_shannon"
harness = false

[[bench]]
name = "subword"
harness = false

[[bench]]
name = "lz76"
harness = false

[[example]]
name = "compression"
required-features = ["compression-deflate"]

[[bench]]
name = "compression"
harness = false
required-features = ["compression-deflate"]
